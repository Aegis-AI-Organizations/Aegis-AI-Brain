[project]
name = "aegis-ai-brain"
version = "0.1.0"
description = "Core orchestration logic for Aegis AI"
authors = [{ name = "Aegis AI Team" }]
dependencies = [
    "alembic>=1.14.0",
    "temporalio>=1.4.0",
    "pydantic>=2.6.3",
    "psycopg[binary]>=3.2.10",
    "fpdf2>=2.8.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=6.31.1,<7.0.0",
    "sqlalchemy>=2.0.0",
    "PyJWT>=2.8.0",
    "minio>=7.2.5",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "clickhouse-connect>=0.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30

[tool.coverage.run]
source = ["src"]
omit = [
    "src/aegis/v2/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
